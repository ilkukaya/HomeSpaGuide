backend:
  name: git-gateway
  branch: main

media_folder: src/assets/uploads
public_folder: /assets/uploads

publish_mode: editorial_workflow

site_url: https://homespaguide.com
display_url: https://homespaguide.com
logo_url: https://homespaguide.com/favicon.svg

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    extension: md
    summary: "{{title}} — {{priceRange}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { label: ASIN, name: asin, widget: string, pattern: ['^[A-Z0-9]{10}$', 'ASIN must be 10 uppercase alphanumerics'] }
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Short title (≤60), name: shortTitle, widget: string }
      - { label: Brand, name: brand, widget: relation, collection: brands, value_field: '{{slug}}', search_fields: [name], display_fields: [name] }
      - { label: Category, name: category, widget: relation, collection: categories, value_field: '{{slug}}', search_fields: [name], display_fields: [name] }
      - { label: Subcategories, name: subcategories, widget: list, required: false }
      - { label: Collections, name: collections, widget: list, required: false }
      - { label: Short description, name: shortDescription, widget: text, hint: "Write as a curator. Cite manufacturer specs and owner reviews. Never claim first-person measurements. See EDITORIAL_VOICE.md." }
      - { label: Description (markdown body), name: description, widget: markdown, hint: "Write as a curator, not a tester. Cite manufacturer specs and owner reviews. Never claim first-person measurements. See EDITORIAL_VOICE.md." }
      - { label: Key features, name: keyFeatures, widget: list }
      - { label: Pros, name: pros, widget: list, required: false }
      - { label: Cons, name: cons, widget: list, required: false }
      - { label: Best for, name: bestFor, widget: list, required: false }
      - label: Specs
        name: specs
        widget: object
        fields:
          - { label: Capacity, name: capacity, widget: number, required: false, value_type: int }
          - { label: Dimensions, name: dimensions, widget: string, required: false }
          - { label: Weight, name: weight, widget: string, required: false }
          - { label: Power requirement, name: powerRequirement, widget: string, required: false }
          - { label: Water capacity, name: waterCapacity, widget: string, required: false }
          - { label: Jet count, name: jetCount, widget: number, required: false, value_type: int }
          - { label: Heater wattage, name: heaterWattage, widget: number, required: false, value_type: int }
          - { label: Setup type, name: setupType, widget: select, required: false, options: [inflatable, hard-shell, plug-and-play, wired] }
          - { label: Indoor / outdoor, name: indoorOutdoor, widget: select, required: false, options: [indoor, outdoor, both] }
          - { label: Seasonality, name: seasonality, widget: select, required: false, options: [summer, all-season, winter-rated] }
          - { label: Materials, name: materials, widget: list, required: false }
          - { label: Warranty, name: warranty, widget: string, required: false }
      - label: Price range
        name: priceRange
        widget: select
        options: [under-100, '100-250', '250-500', '500-1000', '1000-2500', '2500-5000', '5000+']
      - { label: Price updated at, name: priceUpdatedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - label: Editor's score
        name: editorScore
        widget: object
        fields:
          - { label: Overall, name: overall, widget: number, value_type: float, min: 0, max: 10, step: 0.1 }
          - { label: Quality, name: quality, widget: number, value_type: float, min: 0, max: 10, step: 0.1 }
          - { label: Value, name: value, widget: number, value_type: float, min: 0, max: 10, step: 0.1 }
          - { label: Setup, name: setup, widget: number, value_type: float, min: 0, max: 10, step: 0.1 }
          - { label: Durability, name: durability, widget: number, value_type: float, min: 0, max: 10, step: 0.1 }
          - { label: Energy efficiency, name: energyEfficiency, widget: number, required: false, value_type: float, min: 0, max: 10, step: 0.1 }
          - { label: Notes, name: notes, widget: text, required: false }
      - { label: Editor pick, name: editorPick, widget: boolean, default: false }
      - label: Editor badges
        name: editorBadges
        widget: select
        multiple: true
        required: false
        options: ['Best Seller', 'Editor Pick', 'Best Value', 'New', 'Top Rated', 'Budget Pick', 'Premium Pick']
      - { label: Primary image, name: primaryImage, widget: image }
      - { label: Gallery, name: gallery, widget: list, required: false, field: { label: Image, name: image, widget: image } }
      - { label: Image alt, name: imageAlt, widget: string }
      - { label: Amazon canonical URL, name: amazonUrl, widget: string, pattern: ['^https://www\.amazon\.com/.*', 'Must be an amazon.com URL'] }
      - { label: Related products, name: relatedProducts, widget: list, required: false, field: { label: Slug, name: slug, widget: relation, collection: products, value_field: '{{slug}}', search_fields: [title], display_fields: [shortTitle] } }
      - { label: Frequently bought with, name: frequentlyBoughtWith, widget: list, required: false, field: { label: Slug, name: slug, widget: relation, collection: products, value_field: '{{slug}}', search_fields: [title], display_fields: [shortTitle] } }
      - { label: Alternative products, name: alternativeProducts, widget: list, required: false, field: { label: Slug, name: slug, widget: relation, collection: products, value_field: '{{slug}}', search_fields: [title], display_fields: [shortTitle] } }
      - label: SEO
        name: seo
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Meta title, name: metaTitle, widget: string, required: false }
          - { label: Meta description, name: metaDescription, widget: text, required: false }
          - { label: OG image, name: ogImage, widget: image, required: false }
      - { label: Status, name: status, widget: select, options: [active, archived, out-of-stock], default: active }
      - { label: Published at, name: publishedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Updated at, name: updatedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }

  - name: categories
    label: Categories
    folder: src/content/categories
    create: true
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: Parent category, name: parent, widget: relation, required: false, collection: categories, value_field: '{{slug}}', search_fields: [name], display_fields: [name] }
      - { label: Description, name: description, widget: markdown }
      - { label: Short description, name: shortDescription, widget: string }
      - { label: Hero image, name: heroImage, widget: image, required: false }
      - { label: Icon (lucide), name: icon, widget: string, required: false }
      - { label: Order, name: order, widget: number, default: 0, value_type: int }
      - label: FAQs
        name: faqs
        widget: list
        required: false
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }

  - name: brands
    label: Brands
    folder: src/content/brands
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: Logo, name: logo, widget: image, required: false }
      - { label: Description, name: description, widget: text }
      - { label: Founded, name: founded, widget: number, required: false, value_type: int }
      - { label: Country, name: country, widget: string, required: false }
      - { label: Website, name: website, widget: string, required: false }

  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Author, name: author, widget: string, default: 'HomeSpaGuide Editors' }
      - { label: Published at, name: publishedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Updated at, name: updatedAt, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false }
      - label: Category
        name: category
        widget: select
        options: [buying-guide, reviews, comparison, how-to, maintenance, news, seasonal]
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Hero image, name: heroImage, widget: image }
      - { label: Hero image alt, name: heroImageAlt, widget: string }
      - { label: Featured products, name: featuredProducts, widget: list, required: false, field: { label: Slug, name: slug, widget: relation, collection: products, value_field: '{{slug}}', search_fields: [title], display_fields: [shortTitle] } }
      - { label: Show TOC, name: toc, widget: boolean, default: true }
      - { label: Body, name: body, widget: markdown }

  - name: guides
    label: Buying Guides
    folder: src/content/guides
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Topic, name: topic, widget: string }
      - { label: Intro, name: intro, widget: text }
      - { label: Hero image, name: heroImage, widget: image, required: false }
      - { label: Hero image alt, name: heroImageAlt, widget: string, required: false }
      - { label: Recommended products, name: recommendedProducts, widget: list, field: { label: Slug, name: slug, widget: relation, collection: products, value_field: '{{slug}}', search_fields: [title], display_fields: [shortTitle] } }
      - label: Sections
        name: sections
        widget: list
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Body, name: body, widget: markdown }
      - label: FAQs
        name: faqs
        widget: list
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Published at, name: publishedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Updated at, name: updatedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: collections
    label: Collections
    folder: src/content/collections
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Intent, name: intent, widget: select, options: [budget, use-case, seasonal, occasion, brand-spotlight] }
      - { label: Product slugs (ordered), name: productSlugs, widget: list }
      - { label: Hero image, name: heroImage, widget: image, required: false }
      - { label: Updated at, name: updatedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
